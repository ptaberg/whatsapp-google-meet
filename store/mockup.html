<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Store screenshot mockup</title>
<link rel="stylesheet" href="../content.css">
<style>
  :root {
    --bg: #111b21; --panel: #161f25; --raised: #202c33; --line: #2a3942;
    --text: #e9edef; --muted: #8696a0; --out: #005c4b; --in: #202c33; --accent: #00a884;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: var(--bg); color: var(--text); font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  .app { display: grid; grid-template-columns: 56px 340px 1fr; height: 800px; }
  .rail { background: var(--panel); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 18px; padding-top: 16px; }
  .rail i { width: 24px; height: 24px; border-radius: 7px; background: #3b4a54; display: block; }
  .rail i:first-child { background: var(--muted); }
  .list { background: var(--bg); border-right: 1px solid var(--line); overflow: hidden; }
  .list h1 { font-size: 22px; font-weight: 600; margin: 18px 18px 14px; }
  .search { height: 38px; margin: 0 14px 12px; padding: 0 16px; display: flex; align-items: center; border-radius: 19px; background: var(--raised); color: var(--muted); }
  .pills { display: flex; gap: 8px; margin: 0 14px 10px; }
  .pills span { padding: 5px 12px; border-radius: 15px; border: 1px solid var(--line); color: var(--muted); font-size: 13px; }
  .pills .on { background: #103529; border-color: #103529; color: #d9fdd3; }
  .row { display: grid; grid-template-columns: 48px 1fr auto; gap: 2px 12px; align-items: center; margin: 0 8px; padding: 11px 10px; border-radius: 10px; }
  .row.on { background: var(--raised); }
  .avatar { grid-row: span 2; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; font-weight: 600; color: #fff; }
  .name { font-size: 15.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .time { color: var(--muted); font-size: 12px; }
  .preview { grid-column: 2 / 4; color: var(--muted); font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chat { position: relative; display: flex; flex-direction: column; background: #0b141a; min-width: 0; }
  header { height: 64px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header .avatar { width: 40px; height: 40px; grid-row: auto; }
  header strong { font-size: 16px; font-weight: 500; }
  header small { display: block; color: var(--muted); font-size: 12.5px; }
  .actions { margin-left: auto; display: flex; gap: 8px; }
  .icon { width: 40px; height: 40px; padding: 8px; border: 0; background: none; color: var(--text); }
  .icon svg, .composer svg { display: block; width: 24px; height: 24px; fill: currentColor; }
  .messages { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 6px; padding: 20px 56px; }
  .day { align-self: center; margin-bottom: 8px; padding: 4px 12px; border-radius: 8px; background: var(--raised); color: var(--muted); font-size: 12.5px; }
  .msg { max-width: 62%; padding: 7px 10px 6px; border-radius: 8px; background: var(--in); font-size: 14.5px; align-self: flex-start; }
  .msg.out { background: var(--out); align-self: flex-end; }
  .msg time { margin-left: 10px; float: right; padding-top: 5px; color: rgb(233 237 239 / 62%); font-size: 11px; }
  .msg a { color: #53bdeb; text-decoration: none; }
  .composer { height: 72px; flex: none; display: flex; align-items: center; gap: 12px; padding: 0 16px; background: var(--panel); color: var(--muted); }
  .field { flex: 1; height: 44px; display: flex; align-items: center; padding: 0 16px; border-radius: 22px; background: var(--raised); font-size: 15px; }
  .field.filled { color: var(--text); }
  .send { width: 42px; height: 42px; padding: 9px; border-radius: 50%; }
  .send.ready { background: var(--accent); color: #0b141a; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail"><i></i><i></i><i></i><i></i></nav>
  <aside class="list">
    <h1>Chats</h1>
    <div class="search">Search or start a new chat</div>
    <div class="pills"><span class="on">All</span><span>Unread</span><span>Favorites</span><span>Groups</span></div>
    <div id="rows"></div>
  </aside>
  <main class="chat">
    <header id="header">
      <div class="avatar" style="background:#7c5cbf">SR</div>
      <div><strong>Sam Rivera</strong><small>online</small></div>
      <div class="actions">
        <button class="icon" aria-label="Video call"><svg viewBox="0 0 24 24"><path d="M4 7a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v3l4-3v10l-4-3v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/></svg></button>
        <button class="icon" aria-label="Voice call"><svg viewBox="0 0 24 24"><path d="M6.6 3.5 9.4 3l1.5 4.2-1.8 1.5a12 12 0 0 0 6.2 6.2l1.5-1.8 4.2 1.5-.5 2.8c-.2 1-1 1.6-2 1.6C10.700 19 5 13.300 5 5.500c0-1 .6-1.800 1.600-2z"/></svg></button>
        <button class="icon" aria-label="Search"><svg viewBox="0 0 24 24"><path d="M10.500 4a6.500 6.500 0 0 1 5.200 10.400l4.400 4.400-1.300 1.300-4.400-4.400A6.500 6.500 0 1 1 10.500 4zm0 2a4.500 4.500 0 1 0 0 9 4.500 4.500 0 0 0 0-9z"/></svg></button>
        <button class="icon" aria-label="Menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="5.500" r="1.800"/><circle cx="12" cy="12" r="1.800"/><circle cx="12" cy="18.500" r="1.800"/></svg></button>
      </div>
    </header>
    <section class="messages" id="messages"></section>
    <footer class="composer">
      <svg viewBox="0 0 24 24"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg>
      <div class="field" id="field"></div>
      <div class="send" id="send"></div>
    </footer>
  </main>
</div>
<button type="button" class="wamb-button" id="meet">
  <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M4 6.500A2.500 2.500 0 0 1 6.500 4h7A2.500 2.500 0 0 1 16 6.500v2.300l3.900-2.600A.7.7 0 0 1 21 6.800v10.400a.7.7 0 0 1-1.100.6L16 15.200v2.300a2.500 2.500 0 0 1-2.500 2.500h-7A2.500 2.500 0 0 1 4 17.500z"/></svg>
  <span id="meetLabel">Meet</span>
</button>
<script>
  const state = new URLSearchParams(location.search).get('state') || '1';
  const link = 'https://meet.google.com/abc-defg-hij';
  const chats = [
    ['SR', '#7c5cbf', 'Sam Rivera', state === '3' ? '10:47' : '10:46', state === '3' ? 'meet.google.com/abc-defg-hij' : 'Sending you a link now', true],
    ['LT', '#c0683c', 'Launch team', '10:31', 'Maya: Slides are in the folder'],
    ['MC', '#2f8f83', 'Maya Chen', '09:58', 'Thanks, see you Thursday'],
    ['JW', '#4a78c2', 'Jonas Weber', 'Yesterday', 'That works for me'],
    ['BC', '#a9527f', 'Book club', 'Yesterday', 'Priya: Next month is my pick'],
    ['PN', '#8a8f3c', 'Priya Nair', 'Monday', 'Sent the invoice over'],
    ['TO', '#5f6fa8', 'Tom Okafor', 'Sunday', 'Great game last night'],
  ];
  document.getElementById('rows').innerHTML = chats.map(([initials, color, name, time, preview, on]) =>
    `<div class="row ${on ? 'on' : ''}"><div class="avatar" style="background:${color}">${initials}</div><div class="name">${name}</div><div class="time">${time}</div><div class="preview">${preview}</div></div>`).join('');

  const messages = [
    ['in', 'Morning! Did you get a chance to look at the launch plan?', '10:42'],
    ['out', 'Yes, and I have a few notes. Easier to talk it through?', '10:44'],
    ['in', 'Definitely. Are you free now?', '10:45'],
    ['out', 'I am. Sending you a link now', '10:46'],
  ];
  if (state === '3') messages.push(['out', `<a>${link}</a>`, '10:47']);
  document.getElementById('messages').innerHTML = '<div class="day">Today</div>' + messages.map(([side, text, time]) =>
    `<div class="msg ${side === 'out' ? 'out' : ''}">${text}<time>${time}</time></div>`).join('');

  const field = document.getElementById('field');
  const send = document.getElementById('send');
  const filled = state === '2';
  field.textContent = filled ? link : 'Type a message';
  field.classList.toggle('filled', filled);
  send.classList.toggle('ready', filled);
  send.innerHTML = filled
    ? '<svg viewBox="0 0 24 24"><path d="M3 20.500V14l9-2-9-2V3.500L22 12z"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V6a3 3 0 0 1 3-3zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.900V21h-2v-2.100A7 7 0 0 1 5 12z"/></svg>';

  document.getElementById('meetLabel').textContent = filled ? 'Link added' : 'Meet';
  const meet = document.getElementById('meet');
  const header = document.getElementById('header').getBoundingClientRect();
  const firstIcon = document.querySelector('.actions .icon').getBoundingClientRect();
  const size = meet.getBoundingClientRect();
  meet.style.left = `${Math.round(firstIcon.left - size.width - 12)}px`;
  meet.style.top = `${Math.round(header.top + (header.height - size.height) / 2)}px`;
</script>
</body>
</html>
